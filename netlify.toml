[build]
  publish="./build"
  base = "."

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "sameorigin"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"
    Content-Security-Policy = "default-src 'self' netlify-cdp-loader.netlify.app; img-src 'self' data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' netlify-cdp-loader.netlify.app https://challenges.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com; connect-src *; frame-src 'self' app.netlify.com https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org https://challenges.cloudflare.com https://hcaptcha.com https://*.hcaptcha.com; child-src 'self' https://auth.privy.io https://verify.walletconnect.com https://verify.walletconnect.org; style-src 'self' 'unsafe-inline' https://hcaptcha.com https://*.hcaptcha.com;"
