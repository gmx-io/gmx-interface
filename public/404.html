<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#090A14" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png" />
    <title>Page not found | GMX</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
        margin: 0;
      }

      html {
        font-size: 10px;
      }

      body {
        background: #090a14;
        color: #f7f7f8;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      header {
        display: flex;
        align-items: center;
        height: 6.2rem;
        padding: 0 3.2rem;
        border-bottom: 1px solid #23263b;
      }

      header img {
        display: block;
        width: 4.4rem;
        height: auto;
      }

      main {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 6.2rem);
        padding: 3.2rem;
        text-align: center;
      }

      h1 {
        margin: 0 0 1.2rem;
        font-size: 2.4rem;
        font-weight: 500;
      }

      p {
        margin: 0;
        color: #a0a3c4;
        font-size: 1.6rem;
        line-height: 1.5;
      }

      a {
        color: #f7f7f8;
      }

      @media (max-width: 500px) {
        header {
          height: 6.2rem;
          padding: 0 2rem;
        }

        main {
          min-height: calc(100vh - 6.2rem);
          padding: 2rem;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <a href="https://gmx.io" aria-label="GMX homepage"><img src="/logo.png" alt="GMX" /></a>
    </header>
    <main>
      <section>
        <h1>Page not found</h1>
        <p>Return to <a href="https://gmx.io">homepage</a> or <a href="/#/trade">trade</a></p>
      </section>
    </main>
  </body>
</html>
